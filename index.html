<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="google" content="notranslate" />
    <title>YA LLEGA</title>
    <link rel="icon" type="image/jpeg" href="/logotipo.jpeg" />
    <link rel="apple-touch-icon" href="/logotipo.jpeg" />
    <meta name="theme-color" content="#2E7D32" />
    <meta name="description" content="Plataforma de delivery multi-comercio" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        var path = window.location.pathname;
        var isBackoffice = 
          path.startsWith("/admin") || 
          path.startsWith("/driver") || 
          path === "/commerce" || 
          path.startsWith("/commerce/orders") || 
          path.startsWith("/commerce/products") || 
          path.startsWith("/commerce/stats") || 
          path.startsWith("/commerce/profile") || 
          path === "/login";
        
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = isBackoffice ? '/manifest-partners.json' : '/manifest.json';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root" class="notranslate"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
  </body>
</html>
